repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
        args: [backend/]

      # Architecture gate (feat-008). import-linter needs PYTHONPATH so Grimp can
      # locate the backend/siem source roots (not pip-installed as packages).
      - id: import-linter
        name: import-linter (layer contracts)
        entry: bash -c 'PYTHONPATH=backend:services/siem-service uv run lint-imports'
        language: system
        pass_filenames: false
        files: \.(py|toml)$

      - id: arch-checker-ast
        name: arch-checker (AST asserts)
        entry: uv run python -m arch_checker
        language: system
        pass_filenames: false
        files: \.py$
