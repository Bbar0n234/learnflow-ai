[project]
name = "learnflow-backend"
version = "0.1.0"
description = "LearnFlowAI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15",
    "fastapi>=0.135.1",
    "jinja2>=3.1",
    "fuzzysearch>=0.8.0",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.2",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.3.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "structlog>=25.0",
    "uvicorn[standard]>=0.41.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.11.0",
    "langfuse>=4.0.1",
    "langchain>=1.2.13",
    "redis[hiredis]>=7.4.0",
    "siem-contracts>=0.1.0",
    "anyio>=4.12.1",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, no external infra",
    "integration: requires real Postgres (testcontainers)",
    "slow: long-running",
    "external: hits third-party network APIs",
]

[tool.uv.sources]
siem-contracts = { workspace = true }
learnflow-testing = { workspace = true }

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20250915",
    "learnflow-testing",
    "pytest-xdist>=3.6",
]
