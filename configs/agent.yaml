llm:
  model: z-ai/glm-5
  extra_body:
    include_reasoning: true
    reasoning:
      effort: low
context:
  max_tokens: 100000
  compaction_threshold_ratio: 0.75
  recent_messages_to_keep: 10
summarization:
  model: z-ai/glm-4.7-flash
  max_summary_tokens: 500
  extra_body:
    include_reasoning: true
image:
  model: google/gemini-3.1-flash-image
  params: {}
available_models:
- name: z-ai/glm-5
  display_name: GLM-5
- name: z-ai/glm-4.7-flash
  display_name: GLM-4.7 Flash
- name: google/gemini-3.1-pro-preview
  display_name: Gemini 3.1 Pro
subagents:
  llm:
    model: z-ai/glm-4.7-flash
    extra_body:
      include_reasoning: true
  registry:
  - name: judge
    description: >-
      Independent reviewer with a clean context (no session history).
      Give it a task describing the review pass and the artifact id(s)
      to review; it returns a verdict with evidence (quotes/references
      to specific spots), not a bare summary. Has web tools to
      fact-check claims when the verdict depends on verifiable facts.
    prompt: subagent-judge
    tools:
    - firecrawl_search
    - firecrawl_scrape
    - firecrawl_extract
    persistence: none
  - name: web-research
    description: >-
      Researcher with web search/scrape/extract tools and a clean
      context. Give it a research task (and optional reference
      artifact ids); it returns a distilled summary with sources —
      the pages it reads never enter your context.
    prompt: subagent-web-research
    tools:
    - firecrawl_search
    - firecrawl_scrape
    - firecrawl_extract
    persistence: none
  - name: general-purpose
    description: >-
      Generic executor for an isolated subtask with a clean context
      (no session history) and web search/scrape/extract tools. Use
      for self-contained work that should not inherit conversation
      context.
    prompt: subagent-general-purpose
    tools:
    - firecrawl_search
    - firecrawl_scrape
    - firecrawl_extract
    persistence: none
mcp_servers:
  firecrawl:
    enabled: true
    transport: http
    url: https://mcp.firecrawl.dev/mcp
    api_key_env: FIRECRAWL_API_KEY
    allowed_tools:
    - firecrawl_search
    - firecrawl_scrape
    - firecrawl_extract
  tavily:
    enabled: false
    transport: http
    url: https://mcp.tavily.com/mcp/
    api_key_env: TAVILY_API_KEY
    allowed_tools:
    - tavily_search
    - tavily_extract
