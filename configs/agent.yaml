llm:
  model: z-ai/glm-5
  extra_body:
    include_reasoning: true
    reasoning:
      effort: low
context:
  max_tokens: 100000
  compaction_threshold_ratio: 0.75
  recent_messages_to_keep: 10
summarization:
  model: z-ai/glm-4.7-flash
  max_summary_tokens: 500
security:
  guard_model: google/gemini-3.1-flash-lite-preview
  guard_extra_body: {}
  max_retries: 3
  temperature: 0.0
models:
- name: z-ai/glm-5
  match_pattern: (?i)^z-ai/glm-5
  unit: TOKENS
  prices:
    input: 1.0e-06
    output: 3.2e-06
    output_reasoning: 3.2e-06
    input_cache_read: 2.5e-07
- name: z-ai/glm-4.7-flash
  match_pattern: (?i)^z-ai/glm-4\.7-flash
  unit: TOKENS
  prices:
    input: 1.25e-07
    output: 5.0e-07
    output_reasoning: 5.0e-07
    input_cache_read: 3.125e-08
- name: google/gemini-3.1-pro-preview
  match_pattern: (?i)^google/gemini-3\.1-pro-preview
  unit: TOKENS
  prices:
    input: 2.0e-06
    output: 1.2e-05
    output_reasoning: 1.2e-05
    input_cache_read: 5.0e-07
- name: google/gemini-3.1-flash-lite-preview
  match_pattern: (?i)^google/gemini-3\.1-flash-lite-preview
  unit: TOKENS
  prices:
    input: 2.5e-07
    output: 1.5e-06
    input_cache_read: 2.5e-08
available_models:
- name: z-ai/glm-5
  display_name: GLM-5
- name: z-ai/glm-4.7-flash
  display_name: GLM-4.7 Flash
- name: google/gemini-3.1-pro-preview
  display_name: Gemini 3.1 Pro
mcp_servers:
  firecrawl:
    enabled: true
    transport: http
    url: https://mcp.firecrawl.dev/mcp
    api_key_env: FIRECRAWL_API_KEY
    allowed_tools:
    - firecrawl_search
    - firecrawl_scrape_url
    - firecrawl_extract_data
  tavily:
    enabled: false
    transport: http
    url: https://mcp.tavily.com/mcp/
    api_key_env: TAVILY_API_KEY
    allowed_tools:
    - tavily_search
    - tavily_extract
