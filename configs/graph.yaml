# LangGraph workflow configuration with LLM model settings
models:
  # Default model configuration used as fallback
  default:
    provider: openrouter
    model_name: "google/gemini-3-pro-preview"
    temperature: 0.1
    max_tokens: 4000

  nodes:
    recognition_handwritten:
      provider: openai
      model_name: "gpt-4.1-mini"
      temperature: 0.1
      max_tokens: 6000

    generating_questions:
      provider: openrouter
      model_name: "google/gemini-3-pro-preview"
      temperature: 0.0
      max_tokens: 6000

    answer_question:
      provider: openrouter
      model_name: "google/gemini-3-pro-preview"
      temperature: 0.2
      max_tokens: 16000

    edit_material:
      provider: openai
      model_name: "gpt-4.1"
      temperature: 0.2
      max_tokens: 6000

    security_guard:
      provider: openai
      model_name: "gpt-4.1-mini"
      temperature: 0.0
      max_tokens: 1000

    # M2-03 Research Agent nodes
    research_classifier:
      provider: openai
      model_name: "gpt-4.1-mini"
      temperature: 0.0
      max_tokens: 500

    research_agent:
      provider: openai
      model_name: "gpt-4.1"
      temperature: 0.3
      max_tokens: 8000

    # M2-01 Document structure nodes
    planning_structure:
      provider: openrouter
      model_name: "google/gemini-3-pro-preview"
      temperature: 0.3
      max_tokens: 4000

    generate_section:
      provider: openrouter
      model_name: "google/gemini-3-pro-preview"
      temperature: 0.5
      max_tokens: 16000
