services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnflow}
      POSTGRES_DB: ${POSTGRES_DB:-learnflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnflow} -d ${POSTGRES_DB:-learnflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_SIEM_ENABLED: ${SIEM_ENABLED:-true}
    restart: unless-stopped
    # uid 10001 shared with executor and the job sandbox it spawns (cross-
    # track contract — design brief § Executor / ADR-031).
    user: "10001:10001"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://learnflow:learnflow@db:5432/learnflow}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      CLIENT_IP_SOURCE: ${CLIENT_IP_SOURCE:-socket}
      CLIENT_IP_XFF_HOPS: ${CLIENT_IP_XFF_HOPS:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}
      LANGFUSE_PROMPT_LABEL: ${LANGFUSE_PROMPT_LABEL:-development}
      LANGFUSE_PROMPT_CACHE_TTL: ${LANGFUSE_PROMPT_CACHE_TTL:-60}
      CANARY_SECRET: ${CANARY_SECRET:-}
      LLM_DEFENSE_ENABLED: ${LLM_DEFENSE_ENABLED:-true}
      MCP_ENCRYPTION_KEY: ${MCP_ENCRYPTION_KEY:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SIEM_ENABLED: ${SIEM_ENABLED:-true}
      REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT:-5}
      REDIS_SOCKET_CONNECT_TIMEOUT: ${REDIS_SOCKET_CONNECT_TIMEOUT:-5}
      DB_STATEMENT_TIMEOUT_SECONDS: ${DB_STATEMENT_TIMEOUT_SECONDS:-120}
      LLM_GUARD_TIMEOUT_SECONDS: ${LLM_GUARD_TIMEOUT_SECONDS:-45}
      LLM_SUMMARIZER_TIMEOUT_SECONDS: ${LLM_SUMMARIZER_TIMEOUT_SECONDS:-300}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_IMAGE_TIMEOUT_SECONDS: ${LLM_IMAGE_TIMEOUT_SECONDS:-120}
      LLM_TITLE_TIMEOUT_SECONDS: ${LLM_TITLE_TIMEOUT_SECONDS:-20}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-30}
      WORKSPACES_ROOT: ${WORKSPACES_ROOT:-/workspaces}
      SKILLS_ROOT: ${SKILLS_ROOT:-/skills}
      WORKSPACE_READ_LIMIT_CHARS: ${WORKSPACE_READ_LIMIT_CHARS:-50000}
      WORKSPACE_DIFF_FILE_LIMIT_BYTES: ${WORKSPACE_DIFF_FILE_LIMIT_BYTES:-1000000}
      WORKSPACE_DIFF_TOTAL_LIMIT_BYTES: ${WORKSPACE_DIFF_TOTAL_LIMIT_BYTES:-10000000}
      UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-20000000}
      EXECUTOR_BASE_URL: ${EXECUTOR_BASE_URL:-http://executor:8002}
      EXECUTOR_JOB_TIMEOUT_SECONDS: ${EXECUTOR_JOB_TIMEOUT_SECONDS:-60}
      EXECUTOR_CLIENT_TIMEOUT_GRACE_SECONDS: ${EXECUTOR_CLIENT_TIMEOUT_GRACE_SECONDS:-10}
      # MCP external tools — api_key_env from configs/agent.yaml, read directly
      # via os.environ (not through Settings).
      JINA_API_KEY: ${JINA_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    volumes:
      - ./configs:/app/configs:ro
      - ./skills:/skills:ro
      - workspaces:/workspaces
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # In both `default` (db/redis/siem) and `exec` (talks to `executor`) —
    # the only service in both. Explicit list required once any service
    # joins a non-default network, or it drops out of `default` implicitly.
    networks:
      - default
      - exec

  executor:
    build:
      context: .
      dockerfile: services/executor/Dockerfile
    restart: unless-stopped
    # Prod isolation boundary (ADR-031, cross-track contract 6). Default
    # stays runsc (prod guarantee unchanged); dev hosts without a registered
    # `runsc` runtime override via EXECUTOR_RUNTIME=runc in their own .env
    # (compose-level interpolation, not an app Settings knob — architect
    # escalation resolved in tracks/T1/summary.md § T1.11).
    runtime: ${EXECUTOR_RUNTIME:-runsc}
    # uid 10001 shared with `app` and the job sandbox it spawns via bwrap
    # (cross-track contract 4 — design brief § Executor / ADR-031).
    user: "10001:10001"
    cpus: "2"
    mem_limit: 2g
    pids_limit: 256
    # >= EXECUTOR_MAX_TIMEOUT_SECONDS (300) + EXECUTOR_KILL_GRACE_SECONDS (5):
    # the executor's own SIGTERM-then-SIGKILL sequence at job deadline must
    # resolve before compose gives up and force-kills the container.
    stop_grace_period: 320s
    # Default docker seccomp/AppArmor profiles block the userns + masked-path
    # mounts bwrap needs to sandbox a job (layer 3, spikes/spike-bwrap-gvisor.md)
    # — without these the executor can't run any job at all. The isolation
    # boundary for untrusted job code is gVisor (`runtime: runsc`, above) and
    # the bwrap sandbox inside the job, not this container's own
    # seccomp/AppArmor profile. Decision: architect escalation 2026-08-11,
    # fixed in ADR-031.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    environment:
      EXECUTOR_WORKSPACES_ROOT: ${EXECUTOR_WORKSPACES_ROOT:-/workspaces}
      EXECUTOR_SKILLS_ROOT: ${EXECUTOR_SKILLS_ROOT:-/skills}
      EXECUTOR_DEFAULT_TIMEOUT_SECONDS: ${EXECUTOR_DEFAULT_TIMEOUT_SECONDS:-60}
      EXECUTOR_MAX_TIMEOUT_SECONDS: ${EXECUTOR_MAX_TIMEOUT_SECONDS:-300}
      EXECUTOR_MAX_OUTPUT_BYTES: ${EXECUTOR_MAX_OUTPUT_BYTES:-262144}
      EXECUTOR_KILL_GRACE_SECONDS: ${EXECUTOR_KILL_GRACE_SECONDS:-5}
      EXECUTOR_LOG_LEVEL: ${EXECUTOR_LOG_LEVEL:-info}
      # EXECUTOR_SANDBOX_ENABLED intentionally not set — its default (true)
      # must hold in every deployed environment (T3 plan § EXECUTOR_-knobs,
      # Open Question 2).
    volumes:
      - workspaces:/workspaces
      - ./skills:/skills:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Isolated network only — no path to db/redis/app, no egress (ADR-031).
    networks:
      - exec

  siem-db:
    profiles: ["siem"]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SIEM_POSTGRES_USER:-siem}
      POSTGRES_PASSWORD: ${SIEM_POSTGRES_PASSWORD:-siem}
      POSTGRES_DB: ${SIEM_POSTGRES_DB:-siem}
    ports:
      # Loopback-only — needed for `make migrate-siem` and ad-hoc psql from host.
      - "127.0.0.1:${SIEM_POSTGRES_PORT:-5434}:5432"
    volumes:
      - siem_pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIEM_POSTGRES_USER:-siem} -d ${SIEM_POSTGRES_DB:-siem}"]
      interval: 5s
      timeout: 5s
      retries: 5

  siem-service:
    profiles: ["siem"]
    build:
      context: .
      dockerfile: services/siem-service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SIEM_PORT:-8001}:8001"
    environment:
      SIEM_DATABASE_URL: postgresql+asyncpg://${SIEM_POSTGRES_USER:-siem}:${SIEM_POSTGRES_PASSWORD:-siem}@siem-db/${SIEM_POSTGRES_DB:-siem}
      SIEM_REDIS_URL: redis://redis:6379
      SIEM_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
      SIEM_FRONTEND_ORIGIN: ${SIEM_FRONTEND_ORIGIN:-http://localhost:8000,http://localhost:5173}
      SIEM_XREAD_BATCH_SIZE: ${SIEM_XREAD_BATCH_SIZE:-100}
      SIEM_XREAD_BLOCK_MS: ${SIEM_XREAD_BLOCK_MS:-1000}
      SIEM_POLL_INTERVAL_SECONDS: ${SIEM_POLL_INTERVAL_SECONDS:-10}
      SIEM_DELETE_AFTER_DAYS: ${SIEM_DELETE_AFTER_DAYS:-90}
      SIEM_ALERT_OPEN_WINDOW_SECONDS: ${SIEM_ALERT_OPEN_WINDOW_SECONDS:-86400}
      SIEM_MAX_DELIVERY_ATTEMPTS: ${SIEM_MAX_DELIVERY_ATTEMPTS:-5}
      SIEM_REDIS_SOCKET_TIMEOUT: ${SIEM_REDIS_SOCKET_TIMEOUT:-5}
      SIEM_REDIS_SOCKET_CONNECT_TIMEOUT: ${SIEM_REDIS_SOCKET_CONNECT_TIMEOUT:-5}
      SIEM_DB_STATEMENT_TIMEOUT_SECONDS: ${SIEM_DB_STATEMENT_TIMEOUT_SECONDS:-120}
      PYTHONUNBUFFERED: "1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      siem-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: ${DOCKER_MTU:-1500}
  # executor-only network (ADR-031): no db/redis/app reachability, no
  # egress. `internal: true` blocks outbound routing at the bridge level.
  exec:
    internal: true

volumes:
  pgdata:
  redisdata:
  siem_pgdata:
  workspaces:
