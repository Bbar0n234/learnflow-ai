[project]
name = "learnflow-ai"
version = "0.1.0"
description = "AI-powered learning assistant"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pre-commit>=4.5",
    "pytest>=9.0",
    "ruff>=0.15",
    "types-Markdown>=3.5",
]

[tool.uv.workspace]
members = ["backend"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "pdfkit"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mdx_math"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fuzzysearch"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
