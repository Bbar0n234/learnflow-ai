[project]
name = "learnflow-ai"
version = "0.1.0"
description = "AI-powered learning assistant"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pre-commit>=4.5",
    "pytest>=9.0",
    "ruff>=0.15",
    "types-Markdown>=3.5",
]

[tool.uv.workspace]
members = ["backend", "packages/siem-contracts", "services/siem-service"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "**/alembic/versions",
    "**/__pycache__",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "PLC0415", # import-outside-toplevel
]
ignore = [
    "E501",   # line-length handled by formatter
    "B008",   # FastAPI relies on `Depends()` in defaults
]

[tool.ruff.lint.per-file-ignores]
# Bootstrap-time files may need lazy imports for circular-dep reasons; we still
# document each case with `# lazy:` / `# circular:` comments per conventions.md.
"backend/app/main.py" = []

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "pdfkit"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mdx_math"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fuzzysearch"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
