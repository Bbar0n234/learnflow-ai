target-version = "py312"
# 88 — действующая норма (кодовая база отформатирована под неё). Bump до 100 —
# project-wide reformat, отложен в backlog до завершения параллельных slice'ов.
line-length = 88
extend-exclude = [
    "doc/",
    ".claude/skills/", # vendored skill assets — справочный материал, не код проекта
    "**/alembic/versions",
    "**/__pycache__",
]

[lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "PLC0415", # import-outside-toplevel
]
ignore = [
    "E501", # line-length handled by formatter
]
fixable = ["ALL"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
# Bootstrap-time files may need lazy imports for circular-dep reasons; we still
# document each case with `# lazy:` / `# circular:` comments per conventions.md.
"backend/app/main.py" = []

[format]
quote-style = "double"
indent-style = "space"
