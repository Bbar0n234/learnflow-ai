# Alembic Configuration

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %(rev)s_%(slug)0,10s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)s_%%(slug)0,10s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field that's auto-generated by the revision file
# template. The default value is 40 which results
# in FilesNotFoundError if the slug is longer
# Compare this length could exceed 40 (the default generated filename
# size is 14 characters, so 40 is fine).
# migration_word_length = 40

# Whether to run the migrations in a transaction or individually
# This is dependent on the test suite in test_sql_migrations or similar module.
# When the value is true (the default), the entire migration script is
# wrapped in a transaction that gets committed if the script succeeds,
# or rolled back if it has any errors. If this is set to false then the
# individual statements that use the "ddl.disable_transaction()"
# will be executed outside a transaction. Note that some databases may not
# support transactions for certain constructs, and this option will be
# ignored in those cases.
transaction_per_migration = true

# Logging configuration
[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[sqlalchemy]
# the 'sqlalchemy.url' setting should be passed as the "sqlalchemy.url"
# in the alembic.ini's sqlalchemy section, or as the URL argument
# to the `alembic_configure()` function.  The SQLAlchemy database url.
# sqlalchemy.url = driver://user:pass@localhost/dbname

# This setting configures what gets passed by the -x arguments.
# example: -x setting1 -x setting2 will be turned into x_setting1=setting1 x_setting2=setting2
# [x-*]
