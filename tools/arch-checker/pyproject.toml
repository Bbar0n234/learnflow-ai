[project]
name = "learnflow-arch-checker"
version = "0.1.0"
description = "Deterministic architecture checks for LearnFlow AI (AST asserts + import-linter glue)"
requires-python = ">=3.12"
dependencies = [
    "structlog>=25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arch_checker"]
